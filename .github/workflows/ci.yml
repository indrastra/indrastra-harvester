name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: harvester
          POSTGRES_USER: harvester
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harvester -d harvester"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://harvester:test-password@localhost:5432/harvester
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install httpx
      - name: Verify database migrations
        run: alembic upgrade head
      - name: Lint
        run: ruff check backend
      - name: Test
        run: pytest
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: harvester
          POSTGRES_USER: harvester
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harvester -d harvester"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
    env:
      DATABASE_URL: postgresql+psycopg://harvester:test-password@localhost:5432/harvester
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      OPENSEARCH_URL: http://localhost:9200
      JWT_SECRET_KEY: integration-test-signing-secret-at-least-32-chars
      ADMIN_API_TOKEN: ci-test-token-ci-test-token-ci-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install httpx
      - name: Apply migrations
        run: alembic upgrade head
      - name: End-to-end harvest, normalize, index and discover
        run: HARVESTER_INTEGRATION=1 pytest backend/tests/test_integration_acceptance.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build backend image
        run: docker build -t indrastra-harvester-api:ci .
      - name: Build frontend image
        run: docker build -t indrastra-harvester-frontend:ci ./frontend
